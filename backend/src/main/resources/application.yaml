spring:
  application:
    name: scheduler2-be

  web:
    resources:
      static-locations: classpath:/static/

  datasource:
    url: jdbc:h2:mem:app_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password: 

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
